[package]
name = "datagrout-conduit"
version = "0.8.1"
edition = "2021"
rust-version = "1.75"
authors = ["DataGrout <hello@datagrout.ai>"]
license = "MIT"
description = "Production-ready MCP client with mTLS, OAuth 2.1, and semantic discovery"
homepage = "https://github.com/DataGrout/conduit-sdk"
repository = "https://github.com/DataGrout/conduit-sdk"
keywords = ["mcp", "agents", "ai", "datagrout", "llm"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }

# JSON-RPC and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
# Floored past RUSTSEC-2026-0190, an unsoundness in `Error::downcast_mut()`
# fixed in 1.0.103. A bare "1.0" already reaches the fix on a fresh resolve;
# the explicit floor is so a stale or pinned lock cannot select below it.
anyhow = "1.0.103"

# Async traits
async-trait = "0.1"

# UUIDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }

# URL parsing
url = "2.5"

# SSE (Server-Sent Events) support
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"

# WebSocket transport (datagrout-jsonrpc.v1 over wss-mTLS)
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.22", features = ["ring"], default-features = false }
rustls-pemfile = "2.1"
webpki-roots = "0.26"

# Base64 for basic auth
base64 = "0.21"

# PKCE code challenge (SHA-256) for the authorization-code grant
sha2 = { version = "0.10", optional = true }

# Certificate generation for identity registration
rcgen = { version = "0.13", optional = true }
# Time handling for certificate validity (used by rcgen)
time = { version = "0.3", features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"
mockito = "1.2"
tracing-subscriber = "0.3"
criterion = "0.5"
tempfile = "3"
rcgen = "0.13"
time = { version = "0.3", features = ["std"] }

[features]
default = []
full = ["tracing-subscriber"]
# Enables self-signed certificate generation and identity registration flow
registration = ["dep:rcgen", "dep:time"]
# Enables the two-step DG onramp handshake (autonomous agent registration)
onramp = []
# OAuth 2.1 authorization-code + PKCE (browser consent, for user-facing apps)
authcode = ["dep:sha2"]
# Adds the 127.0.0.1 redirect listener. Needs no extra dependency in Rust; the
# split exists so the surface matches the other conduit SDKs, where a local HTTP
# server IS a dependency, and so headless callers can skip it.
authcode-loopback = ["authcode"]
# RFC 8693 token exchange: an agent acting for a user (sub = user, act = agent).
# No extra dependency; the split exists so the surface matches the other
# conduit SDKs and so callers who never delegate compile none of it.
delegation = []
# Full self-service bootstrap: onramp handshake + mTLS identity registration
bootstrap = ["onramp", "registration"]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "browser_signin"
path = "examples/browser_signin.rs"
required-features = ["authcode-loopback"]

[[example]]
name = "delegated_agent"
path = "examples/delegated_agent.rs"
required-features = ["delegation"]

[[example]]
name = "discovery"
path = "examples/discovery.rs"

[[example]]
name = "guided_workflow"
path = "examples/guided_workflow.rs"

[[example]]
name = "flow_orchestration"
path = "examples/flow_orchestration.rs"

[[example]]
name = "type_transformation"
path = "examples/type_transformation.rs"

[[example]]
name = "cost_tracking"
path = "examples/cost_tracking.rs"

[[example]]
name = "batch_operations"
path = "examples/batch_operations.rs"

[[example]]
name = "bootstrap"
path = "examples/bootstrap.rs"
required-features = ["onramp", "registration"]
